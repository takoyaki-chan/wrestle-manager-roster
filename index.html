<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="女子プロレス団体経営シミュレーション WRESTLE MANAGER に登場する全127選手の名鑑。">
<meta property="og:title" content="WRESTLE MANAGER 選手名鑑">
<meta property="og:description" content="女子プロレス団体経営シミュレーション WRESTLE MANAGER に登場する全127選手の名鑑。">
<link rel="icon" href="data:,">
</head>
<body>
<title>WRESTLE MANAGER 選手名鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700;900&family=Oswald:wght@400;500;700&display=swap">
<style>
:root{
  /* Layout: 名鑑の壁 — 固定の操作バーの下に 2:3 の上半身を並べ、選手を押すと詳細シートが重なる。
     ゲーム本体(選手ファイル)と同じ暗い会場色の単一テーマ。数値の塗りは stat-notation v1.0 の7帯 */
  color-scheme: dark;
  --bg: #24221e;
  --panel: #181614;
  --well: #12110e;
  --raise: #2e2b26;
  --ink: #e8e6e0;
  --ink-sub: rgba(232,230,224,.62);
  --ink-dim: rgba(232,230,224,.36);
  --line: rgba(200,190,170,.10);
  --line-strong: rgba(200,190,170,.22);
  --gold: #d4a843;
  --gold-light: #f0d078;
  --gold-ink: #1a1712;
  --scrim: rgba(10,9,8,.82);
  --chip-bg: rgba(12,11,9,.74);

  --stat-pw: #e74c3c;
  --stat-sp: #2ecc71;
  --stat-te: #3498db;
  --stat-st: #f39c12;
  --stat-mn: #9b59b6;
  --tier-0: #63615b;
  --tier-1: #a8a59d;
  --tier-white: #f2f0e8;

  --st-Grappler: #bb8fce;
  --st-Striker: #e74c3c;
  --st-Submission: #e67e22;
  --st-Aerial: #2ecc71;
  --st-Allround: #f1c40f;
  --st-Brawler: #e88a82;
  --site-pixiv: #4aa3f0;
  --site-fanbox: #f0a64a;

  --font-display: 'Bebas Neue', 'Oswald', Impact, sans-serif;
  --font-label: 'Oswald', 'Arial Narrow', sans-serif;
  --font-body: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', Meiryo, sans-serif;
  --r-sm: 4px;
  --r-md: 6px;
  --r-lg: 10px;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.wrap { width: 100%; max-width: 1360px; margin-inline: auto; padding-inline: max(16px, 2.5vw); }

/* ── 見出し ───────────────────────────── */
.mast { padding-block: 34px 22px; }
.mast-kicker {
  font-family: var(--font-label); font-size: 11px; letter-spacing: .32em;
  color: var(--gold); text-transform: uppercase;
}
.mast-title { display: flex; align-items: baseline; gap: 6px 16px; flex-wrap: wrap; margin: 8px 0 10px; }
.mast-logo {
  font-family: var(--font-display); font-size: clamp(36px, 6vw, 58px); line-height: .9;
  letter-spacing: .08em; color: var(--gold);
  background: linear-gradient(180deg, var(--gold-light), var(--gold) 70%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.mast h1 { margin: 0; font-size: clamp(22px, 3vw, 30px); font-weight: 900; letter-spacing: .14em; text-wrap: balance; }
.mast-lede { margin: 0; max-width: 62ch; color: var(--ink-sub); font-size: 13px; }
.mast-facts { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 14px 0 0; padding: 0; list-style: none; font-size: 12px; color: var(--ink-sub); }
.mast-facts b {
  margin-right: 5px; font-family: var(--font-display); font-size: 24px; font-weight: 400;
  letter-spacing: .04em; color: var(--ink); font-variant-numeric: tabular-nums;
}

/* ── 操作バー ─────────────────────────── */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  border-block: 1px solid var(--line-strong);
  background: color-mix(in srgb, var(--panel) 94%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.bar-in { display: flex; flex-direction: column; gap: 8px; padding-block: 10px; }
.bar-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; min-width: 0; }
.ctl { display: flex; align-items: center; gap: 7px; }
.ctl-label {
  font-family: var(--font-label); font-size: 10px; letter-spacing: .2em;
  color: var(--ink-dim); text-transform: uppercase; white-space: nowrap;
}
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r-sm); overflow: hidden; }
.seg button {
  appearance: none; border: 0; background: transparent; color: var(--ink-sub);
  font-size: 12px; padding: 5px 12px; white-space: nowrap;
}
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); font-weight: 700; }
.field {
  min-width: 0; padding: 5px 9px; border: 1px solid var(--line-strong); border-radius: var(--r-sm);
  background: var(--well); color: var(--ink); font-size: 12.5px;
}
select.field { padding-right: 26px; }
.dir {
  appearance: none; padding: 4px 10px; border: 1px solid var(--line-strong); border-radius: var(--r-sm);
  background: transparent; color: var(--ink-sub); font-size: 12px; white-space: nowrap;
}
.dir:hover { color: var(--ink); border-color: var(--gold); }
.search { flex: 1 1 220px; }
.chips { display: flex; gap: 6px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  appearance: none; flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border: 1px solid var(--line-strong); border-radius: 999px;
  background: transparent; color: var(--ink-sub); font-size: 12px; white-space: nowrap;
}
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--ink-dim)); }
.chip small { font-family: var(--font-label); font-size: 11px; color: var(--ink-dim); }
.chip:hover { color: var(--ink); }
.chip[aria-pressed="true"] {
  color: var(--ink); border-color: var(--c, var(--gold));
  background: color-mix(in srgb, var(--c, var(--gold)) 18%, transparent);
}
.chips-sep { width: 1px; align-self: stretch; background: var(--line-strong); flex: 0 0 auto; }
.count { margin-left: auto; font-size: 12px; color: var(--ink-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
.count b { color: var(--ink); font-weight: 700; }

/* ── 名鑑本体 ─────────────────────────── */
.roster { padding-block: 18px 12px; min-height: 40vh; }
.grp { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; margin: 26px 0 12px; padding-bottom: 7px; border-bottom: 1px solid var(--line); }
.grp:first-child { margin-top: 4px; }
.grp i { width: 10px; height: 10px; border-radius: 2px; background: var(--c, var(--gold)); }
.grp h2 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .06em; }
.grp small { font-family: var(--font-label); font-size: 11px; letter-spacing: .08em; color: var(--ink-dim); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(146px, 1fr)); gap: 18px 12px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); gap: 16px; align-items: start; }

.portrait {
  position: relative; display: block; width: 100%; max-width: 100%; aspect-ratio: 2 / 3; overflow: hidden;
  border-radius: var(--r-md); border-bottom: 3px solid var(--c, var(--gold));
  background: linear-gradient(180deg, var(--raise), var(--well));
}
.portrait img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; transition: transform .4s ease; }
.portrait .ph {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 36px; font-weight: 900; color: var(--ink-dim);
}
.rank {
  position: absolute; top: 6px; left: 6px; min-width: 28px; padding: 2px 7px 0;
  border-radius: var(--r-sm); background: var(--chip-bg); text-align: center;
  font-family: var(--font-display); font-size: 18px; line-height: 1.2; color: var(--gold-light);
  font-variant-numeric: tabular-nums;
}

.tile {
  appearance: none; display: flex; flex-direction: column; min-width: 0; padding: 0;
  border: 0; border-radius: var(--r-md); background: none; text-align: left;
}
.tile:hover .portrait img, .card-img:hover img { transform: scale(1.035); }
.tile-body { display: flex; flex-direction: column; gap: 1px; min-width: 0; padding: 8px 2px 0; }
.tile-name { font-size: 14px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
.roman {
  font-family: var(--font-label); font-size: 9.5px; letter-spacing: .14em; line-height: 1.35;
  color: var(--ink-dim); text-transform: uppercase; overflow-wrap: anywhere;
}
.meta { display: flex; align-items: center; gap: 5px; margin-top: 2px; font-size: 11px; color: var(--ink-sub); white-space: nowrap; }
.dot { flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.meta .h { font-family: var(--font-label); font-variant-numeric: tabular-nums; }
/* 身長で並べたときは身長を金に(能力値は一覧に出さず、詳細シートだけに置く) */
.roster[data-sort="h"] .h { color: var(--gold-light); }

/* 数値の7帯(stat-notation v1.0 §1) */
[data-k="pw"] { --k: var(--stat-pw); }
[data-k="sp"] { --k: var(--stat-sp); }
[data-k="te"] { --k: var(--stat-te); }
[data-k="st"] { --k: var(--stat-st); }
[data-k="mn"] { --k: var(--stat-mn); }
[data-k="ovr"] { --k: var(--gold); }
.tv { font-family: var(--font-label); font-weight: 400; font-variant-numeric: tabular-nums; }
.t0 { color: var(--tier-0); }
.t1 { color: var(--tier-1); }
.t2 { color: var(--tier-white); }
.t3 { color: color-mix(in srgb, var(--k) 50%, var(--tier-white)); }
.t4 { color: color-mix(in srgb, var(--k) 80%, var(--tier-white)); }
.t5 { color: var(--k); font-weight: 700; }
.t6 {
  color: color-mix(in srgb, var(--k) 78%, var(--tier-white)); font-weight: 700;
  text-shadow: 0 0 6px color-mix(in srgb, var(--k) 80%, transparent), 0 0 14px color-mix(in srgb, var(--k) 33%, transparent);
}

/* 紹介文つきカード */
.card {
  display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 14px 16px; min-width: 0;
  padding: 14px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--panel);
}
.card-img { appearance: none; display: block; width: 132px; padding: 0; border: 0; background: none; align-self: start; }
.card-head { min-width: 0; }
.kana { font-size: 10.5px; letter-spacing: .12em; color: var(--ink-dim); line-height: 1.4; }
.name-btn {
  appearance: none; display: block; margin: 0; padding: 0; border: 0; background: none; text-align: left;
  font-size: 18px; font-weight: 700; line-height: 1.35;
}
.name-btn:hover { color: var(--gold-light); }
.badges { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin: 7px 0 9px; font-size: 11px; }
.badge {
  padding: 1px 7px; border-radius: 2px; white-space: nowrap;
  border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
  background: color-mix(in srgb, var(--c) 14%, transparent);
  color: color-mix(in srgb, var(--c) 72%, var(--ink));
}
.badge.role { border-color: var(--line-strong); background: transparent; color: var(--ink-sub); }
.badges .h { margin-left: 2px; color: var(--ink-sub); font-family: var(--font-label); font-size: 12px; }
.ovr-line { display: flex; align-items: baseline; gap: 7px; margin-bottom: 7px; }
.ovr-line .tv { font-family: var(--font-display); font-size: 32px; font-weight: 400; line-height: 1; }
.ovr-line span { font-family: var(--font-label); font-size: 9px; letter-spacing: .22em; color: var(--ink-dim); }
.bars { display: grid; gap: 3px; }
.bar-r { display: grid; grid-template-columns: 24px minmax(0, 1fr) 24px; align-items: center; gap: 8px; padding: 1px 3px; border-radius: 3px; }
.bar-r small { font-family: var(--font-label); font-size: 10px; letter-spacing: .06em; color: color-mix(in srgb, var(--k) 75%, var(--ink)); }
.track { height: 5px; overflow: hidden; border-radius: 3px; background: var(--well); }
.track i { display: block; height: 100%; border-radius: 3px; background: var(--k); }
.bar-r .tv { font-size: 13px; text-align: right; }
.card-foot { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.traits { display: flex; flex-wrap: wrap; gap: 5px; }
.trait {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 2px;
  border-radius: var(--r-sm); background: var(--well); font-size: 11.5px; white-space: nowrap;
}
.ticon {
  display: grid; place-items: center; width: 19px; height: 19px; flex: 0 0 auto; border-radius: 3px;
  font-size: 11px; font-weight: 700; font-style: normal; line-height: 1; color: var(--tc);
  border: 1px solid color-mix(in srgb, var(--tc) 50%, transparent);
  background: color-mix(in srgb, var(--tc) 15%, transparent);
}
.profile { margin: 0; font-size: 13px; line-height: 1.9; color: color-mix(in srgb, var(--ink) 90%, transparent); }
.origin { display: grid; gap: 6px; padding-top: 10px; border-top: 1px dashed var(--line-strong); font-size: 12px; }
.origin-src { color: var(--ink-sub); }
.origin-src b { color: var(--ink); font-weight: 700; }
.works { display: grid; gap: 2px; margin: 0; padding: 0; list-style: none; }
.works a {
  display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; align-items: baseline; gap: 8px;
  padding: 3px 6px; border-radius: var(--r-sm); color: var(--ink); text-decoration: none;
}
.works a:hover { background: var(--raise); }
.works a:hover .wt { text-decoration: underline; text-underline-offset: 3px; }
.site {
  font-family: var(--font-label); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase;
  text-align: center; padding: 0 4px; border-radius: 2px;
  color: var(--sc); border: 1px solid color-mix(in srgb, var(--sc) 45%, transparent);
}
.site.pixiv { --sc: var(--site-pixiv); }
.site.fanbox { --sc: var(--site-fanbox); }
.wt { overflow-wrap: anywhere; line-height: 1.5; }
.wy { font-family: var(--font-label); font-size: 11px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }

.empty { display: grid; justify-items: start; gap: 10px; padding: 40px 0; color: var(--ink-sub); }

/* ── 詳細シート ───────────────────────── */
.sheet {
  position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px));
  background: var(--scrim);
}
.sheet-box {
  display: flex; flex-direction: column; width: min(780px, 100%); max-height: 100%; overflow: hidden;
  border: 1px solid var(--line-strong); border-radius: var(--r-lg); background: var(--bg);
  box-shadow: 0 24px 64px rgba(0,0,0,.6);
}
.sheet-head {
  display: flex; align-items: center; gap: 10px; flex: 0 0 auto;
  padding: 9px 12px 9px 18px; border-bottom: 1px solid var(--line); background: var(--panel);
}
.sheet-no { font-family: var(--font-label); font-size: 11px; letter-spacing: .18em; color: var(--gold); }
.sheet-pos { font-family: var(--font-label); font-size: 11px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.sheet-nav { display: flex; gap: 6px; margin-left: auto; }
.icon-btn {
  appearance: none; display: grid; place-items: center; width: 34px; height: 32px; padding: 0;
  border: 1px solid var(--line-strong); border-radius: var(--r-sm); background: transparent;
  color: var(--ink-sub); font-size: 15px; line-height: 1;
}
.icon-btn:hover { color: var(--ink); border-color: var(--gold); }
.sheet-body { overflow-y: auto; overscroll-behavior: contain; }
.sheet-main { display: flex; flex-wrap: wrap; gap: 18px 22px; padding: 20px; }
.sheet-img { width: 172px; flex: 0 0 auto; }
.sheet-info { flex: 1 1 300px; min-width: 0; }
.sheet-name { margin: 0; font-size: 22px; font-weight: 900; line-height: 1.3; letter-spacing: .04em; }
.sheet-charts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; }
.sheet-charts .bars { flex: 1 1 180px; min-width: 0; }
.sheet-charts .bar-r { grid-template-columns: 64px minmax(0, 1fr) 24px; }
.sheet-charts .bar-r small { font-family: var(--font-body); font-size: 11px; letter-spacing: 0; }
.radar { flex: 0 0 auto; width: 230px; max-width: 100%; height: auto; }
.rg-ring { fill: none; stroke: var(--line-strong); stroke-width: 1; }
.rg-axis { stroke: var(--line); stroke-width: 1; }
.rg-poly { fill: color-mix(in srgb, var(--gold) 25%, transparent); stroke: var(--gold); stroke-width: 1.6; stroke-linejoin: round; }
.rg-pt { fill: var(--gold-light); }
.rg-lab { font-family: var(--font-label); font-size: 11px; letter-spacing: .06em; fill: var(--k); }
.rg-val { font-family: var(--font-label); font-size: 11px; fill: var(--ink-sub); }
.sheet-sec { padding: 0 20px 18px; }
.sec-label {
  margin-bottom: 9px; padding-bottom: 5px; border-bottom: 1px solid var(--line);
  font-family: var(--font-label); font-size: 10px; letter-spacing: .24em; color: var(--gold); text-transform: uppercase;
}
.trait-row { display: grid; grid-template-columns: 19px auto minmax(0, 1fr); align-items: center; gap: 4px 9px; margin-bottom: 6px; }
.trait-row b { font-size: 13px; }
.trait-row span { font-size: 11.5px; color: var(--ink-sub); }
.sheet .profile { font-size: 13.5px; max-width: 65ch; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 5px 14px; margin: 0 0 10px; font-size: 12.5px; }
.facts dt { color: var(--ink-dim); }
.facts dd { margin: 0; }

/* ── フッター ─────────────────────────── */
.foot { padding-block: 26px 40px; border-top: 1px solid var(--line); color: var(--ink-dim); font-size: 11.5px; }
.foot p { margin: 0 0 6px; max-width: 80ch; }
.foot .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.foot .legend span { white-space: nowrap; }
.foot .legend b { font-family: var(--font-label); font-weight: 500; color: var(--k); margin-right: 4px; }

.reset {
  appearance: none; padding: 5px 12px; border: 1px solid var(--gold); border-radius: var(--r-sm);
  background: transparent; color: var(--gold-light); font-size: 12px;
}

@media (max-width: 720px) {
  .bar { position: static; }
  .chips-sep { display: none; }
  .search { flex-basis: 100%; }
  .count { margin-left: 0; }
  .card { grid-template-columns: 108px minmax(0, 1fr); padding: 12px; }
  .card-img { width: 108px; }
  .sheet { align-items: flex-start; }
  .sheet-main { padding: 16px; }
  .sheet-img { margin-inline: auto; }
  .sheet-sec { padding: 0 16px 16px; }
  .radar { margin-inline: auto; }
}
@media (max-width: 380px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 10px; }
}
@media (prefers-reduced-motion: reduce) {
  .portrait img { transition: none; }
}
</style>

<header class="mast wrap">
  <div class="mast-kicker">Personnel Files — All Wrestlers</div>
  <div class="mast-title">
    <span class="mast-logo" aria-hidden="true">WRESTLE MANAGER</span>
    <h1>選手名鑑</h1>
  </div>
  <p class="mast-lede">女子プロレス団体経営シミュレーション「WRESTLE MANAGER」に登場する選手の全員名簿。能力で並べ替え、スタイルや出身作品でまとめて見比べられます。選手を押すと詳しいプロフィールと登場作品が開きます。</p>
  <ul class="mast-facts" id="facts"></ul>
</header>

<div class="bar">
  <div class="wrap bar-in">
    <div class="bar-row">
      <div class="ctl">
        <span class="ctl-label" id="viewLabel">表示</span>
        <div class="seg" id="view" role="group" aria-labelledby="viewLabel">
          <button type="button" data-v="grid">一覧</button>
          <button type="button" data-v="cards">紹介文つき</button>
        </div>
      </div>
      <div class="ctl">
        <label class="ctl-label" for="sort">並び</label>
        <select class="field" id="sort"></select>
        <button type="button" class="dir" id="dir"></button>
      </div>
      <div class="ctl">
        <span class="ctl-label" id="groupLabel">まとめ</span>

  function portraitHtml(f, lazy) {
    const initial = esc(f.name.charAt(0));
    const img = f.img ? `<img src="${esc(IMG + f.img)}" alt="" ${lazy ? 'loading="lazy"' : ''} decoding="async">` : '';
    return `<span class="portrait" style="--c:var(--st-${esc(f.style)})">${img}<span class="ph"${f.img ? ' hidden' : ''}>${initial}</span><span class="rank" hidden></span></span>`;
  }
  function wireImageFallback(root) {
    root.querySelectorAll('.portrait img').forEach(img => {
      img.addEventListener('error', () => { img.hidden = true; img.nextElementSibling.hidden = false; }, { once: true });
    });
  }
  function styleBadge(f) {
    return `<span class="badge" style="--c:var(--st-${esc(f.style)})">${esc(STYLE_JA[f.style] || f.style)}</span>`;

    const parts = [];

  function radarSvg(f) {
    const cx = 130, cy = 108, R = 70;
    const pt = (i, v) => {
      const a = -Math.PI / 2 + i * 2 * Math.PI / 5;
      return [cx + Math.cos(a) * R * v / 100, cy + Math.sin(a) * R * v / 100];
    };
    const poly = v => STATS.map((_, i) => pt(i, v).map(n => n.toFixed(1)).join(',')).join(' ');
    const rings = [25, 50, 75, 100].map(v => `<polygon class="rg-ring" points="${poly(v)}"/>`).join('');
    const axes = STATS.map((_, i) => { const [x, y] = pt(i, 100); return `<line class="rg-axis" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`; }).join('');
    const vals = STATS.map(([k]) => Math.max(0, Math.min(100, f[k])));
    const shape = vals.map((v, i) => pt(i, v).map(n => n.toFixed(1)).join(',')).join(' ');
    const dots = vals.map((v, i) => { const [x, y] = pt(i, v); return `<circle class="rg-pt" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.4"/>`; }).join('');
    const labels = STATS.map(([k, abbr], i) => {
      const a = -Math.PI / 2 + i * 2 * Math.PI / 5;
      const x = cx + Math.cos(a) * (R + 16);
      const y = cy + Math.sin(a) * (R + 16);
      const anchor = Math.abs(Math.cos(a)) < 0.2 ? 'middle' : Math.cos(a) > 0 ? 'start' : 'end';
      const dy = Math.sin(a) < -0.5 ? -2 : Math.sin(a) > 0.5 ? 10 : 4;
      return `<text class="rg-lab" data-k="${k}" x="${x.toFixed(1)}" y="${(y + dy).toFixed(1)}" text-anchor="${anchor}">${abbr} <tspan class="rg-val">${f[k]}</tspan></text>`;
    }).join('');
    return `<svg class="radar" viewBox="0 0 260 210" role="img" aria-label="能力レーダー: ${STATS.map(([k, , ja]) => `${ja}${f[k]}`).join('、')}">${rings}${axes}<polygon class="rg-poly" points="${shape}"/>${dots}${labels}</svg>`;
  }

  function sheetHtml(f) {
    const traitRows = f.traits.map(t => {
      const d = DATA.traits[t];
      return `<div class="trait-row"><i class="ticon" style="--tc:${esc(d.color)}">${esc(d.icon)}</i><b>${esc(t)}</b><span>${esc(d.desc)}</span></div>`;
    }).join('');
    const facts = [];
    if (f.series) facts.push(`<dt>出身作品</dt><dd>${esc(f.series)}</dd>`);
    if (f.aff) facts.push(`<dt>所属</dt><dd>${esc(f.aff)}</dd>`);
    const s = f.series && seriesByName.get(f.series);
    if (s && s.first) facts.push(`<dt>シリーズ初出</dt><dd>${esc(s.first.slice(0, 4))}年</dd>`);
    return `
      <div class="sheet-main">
        <div class="sheet-img">${portraitHtml(f, false)}</div>
        <div class="sheet-info">
          ${f.kana ? `<div class="kana">${esc(f.kana)}</div>` : ''}
          <h2 class="sheet-name" id="sheetName">${esc(f.name)}</h2>
          <div class="roman">${esc(f.roman)}</div>
          <div class="badges">${styleBadge(f)}${roleBadge(f)}<span class="h">${f.h}cm</span></div>
          <div class="ovr-line">${tv('ovr', f.ovr)}<span>OVR</span></div>
          <div class="sheet-charts">${radarSvg(f)}${barsHtml(f, true)}</div>
        </div>
      </div>
      ${traitRows ? `<div class="sheet-sec"><div class="sec-label">特性</div>${traitRows}</div>` : ''}
      ${f.profile ? `<div class="sheet-sec"><div class="sec-label">プロフィール</div><p class="profile">${esc(f.profile)}</p></div>` : ''}
      ${facts.length || f.works.length ? `<div class="sheet-sec"><div class="sec-label">出身と登場作品</div>${facts.length ? `<dl class="facts">${facts.join('')}</dl>` : ''}${worksHtml(f)}</div>` : ''}`;
  }

  // ── 絞り込み・並べ替え・まとめ ───────────────────────
  const fold = s => String(s || '').toLowerCase().replace(/[\s　・.]/g, '');
  function visible() {
    const q = fold(state.q);
    return FIGHTERS.filter(f =>
      (!state.style || f.style === state.style) &&
      (!state.role || f.role === state.role) &&
      (!state.trait || f.traits.includes(state.trait)) &&
      (!q || fold(f.name).includes(q) || fold(f.kana).includes(q) || fold(f.roman).includes(q) || fold(f.sortKana).includes(q)));
  }
  function ordered(list) {
    const k = state.sort;
    const dir = state.desc ? -1 : 1;
    return list.slice().sort((a, b) => {
      const c = k === 'kana' ? collator.compare(a.sortKana, b.sortKana) : a[k] - b[k];
      return c * dir || a.id - b.id;
    });
  }
  function grouped(list) {
    if (state.group === 'style') {
      return STYLE_ORDER.map(s => ({ label: STYLE_JA[s], color: `var(--st-${s})`, items: list.filter(f => f.style === s) }))
        .filter(g => g.items.length)
        .map(g => ({ ...g, note: `${g.items.length}名` }));
    }
    if (state.group === 'series') {
      const groups = DATA.series.map(s => ({
        label: s.name,
        items: list.filter(f => f.series === s.name),
        note: s.first ? `${s.first.slice(0, 4)}年〜` : '',
      }));
      groups.push({ label: '出身作品の登録なし', items: list.filter(f => !f.series), note: '' });
      return groups.filter(g => g.items.length).map(g => ({ ...g, note: [g.note, `${g.items.length}名`].filter(Boolean).join(' · ') }));
    }
    return [{ label: '', items: list }];
  }
  // 同値は同順位(1,2,2,4)。まとめているときはまとまりの中での順位
  function ranks(items) {
    const k = state.sort;
    const out = new Map();
    items.forEach(f => {
      const better = items.filter(o => state.desc ? o[k] > f[k] : o[k] < f[k]).length;
      out.set(f.id, better + 1);
    });
    return out;
  }

  // ── 描画(並びが変わると選手が新しい位置へ滑って移動する) ─────────────
  const rosterEl = document.getElementById('roster');
  const nodes = { grid: new Map(), cards: new Map() };
  let flatOrder = [];

  function render(animate) {
    const list = ordered(visible());
    const groups = grouped(list);
    const pool = nodes[state.view];
    const make = state.view === 'grid' ? tileEl : cardEl;
    const move = animate && !reducedMotion.matches;

    const first = new Map();
    if (move) rosterEl.querySelectorAll('.tile, .card').forEach(el => first.set(el, el.getBoundingClientRect()));

    rosterEl.dataset.sort = state.sort;
    const frag = document.createDocumentFragment();
    flatOrder = [];
    const metric = SORTS[state.sort].metric;
    for (const g of groups) {
      if (g.label) {
        const head = document.createElement('div');
        head.className = 'grp';
        head.innerHTML = `${g.color ? `<i style="--c:${g.color}"></i>` : ''}<h2>${esc(g.label)}</h2><small>${esc(g.note)}</small>`;
        frag.append(head);
      }
      const box = document.createElement('div');
      box.className = state.view === 'grid' ? 'tiles' : 'cards';
      const rank = metric ? ranks(g.items) : null;
      for (const f of g.items) {
        let el = pool.get(f.id);
        if (!el) { el = make(f); pool.set(f.id, el); }
        const badge = el.querySelector('.rank');
        if (badge) { badge.hidden = !rank; badge.textContent = rank ? rank.get(f.id) : ''; }
        box.append(el);
        flatOrder.push(f.id);
      }
      frag.append(box);
    }
    if (!list.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = '<p style="margin:0">条件に合う選手はいません。</p><button type="button" class="reset">絞り込みを解除</button>';
      empty.querySelector('button').addEventListener('click', clearFilters);
      frag.append(empty);
    }
    rosterEl.replaceChildren(frag);
    document.getElementById('count').innerHTML = `表示 <b>${list.length}</b> / ${FIGHTERS.length}名`;

    if (move) {
      const vh = window.innerHeight;
      rosterEl.querySelectorAll('.tile, .card').forEach(el => {
        const before = first.get(el);
        const after = el.getBoundingClientRect();
        if (!before) {
          if (after.bottom > 0 && after.top < vh) el.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 260, easing: 'ease-out' });
          return;
        }
        const dx = before.left - after.left;
        const dy = before.top - after.top;
        if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
        const onScreen = (before.bottom > 0 && before.top < vh) || (after.bottom > 0 && after.top < vh);
        if (!onScreen) return;
        el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration: 480, easing: 'cubic-bezier(.2,.75,.15,1)' });
      });
    }
  }

  // ── 操作バー ────────────────────────────────────
  const sortSel = document.getElementById('sort');
  sortSel.innerHTML = Object.entries(SORTS).map(([k, s]) => `<option value="${k}">${esc(s.label)}</option>`).join('');
  const dirBtn = document.getElementById('dir');
  const traitSel = document.getElementById('trait');
  traitSel.innerHTML = '<option value="">特性: すべて</option>' + Object.keys(DATA.traits).map(t => {
    const n = FIGHTERS.filter(f => f.traits.includes(t)).length;
    return `<option value="${esc(t)}">${esc(t)}(${n})</option>`;
  }).join('');

  function chipHtml(value, label, color, n) {
    return `<button type="button" class="chip" data-v="${esc(value)}" aria-pressed="false"${color ? ` style="--c:${color}"` : ''}>${color ? '<i></i>' : ''}${esc(label)}<small>${n}</small></button>`;
  }
  const stylesEl = document.getElementById('styles');
  stylesEl.innerHTML = STYLE_ORDER.map(s => chipHtml(s, STYLE_JA[s], `var(--st-${s})`, FIGHTERS.filter(f => f.style === s).length)).join('');
  const rolesEl = document.getElementById('roles');
  rolesEl.innerHTML = ROLE_ORDER.map(r => chipHtml(r, ROLE_JA[r], '', FIGHTERS.filter(f => f.role === r).length)).join('');

  function syncControls() {
    document.querySelectorAll('#view button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === state.view)));
    document.querySelectorAll('#group button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === state.group)));
    stylesEl.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === state.style)));
    rolesEl.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === state.role)));
    sortSel.value = state.sort;
    traitSel.value = state.trait;
    const metric = SORTS[state.sort].metric;
    dirBtn.textContent = state.desc ? (metric ? '↓ 高い順' : '↓ 降順') : (metric ? '↑ 低い順' : '↑ 昇順');
    dirBtn.setAttribute('aria-label', `並び順を反転(いまは${state.desc ? '降順' : '昇順'})`);
  }
  function update(animate = true) { syncControls(); render(animate); savePrefs(); }
  function clearFilters() {
    Object.assign(state, { style: '', role: '', trait: '', q: '' });
    document.getElementById('q').value = '';
    update();
  }

  document.getElementById('view').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.dataset.v === state.view) return;
    state.view = b.dataset.v; update(false);
  });
  document.getElementById('group').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.dataset.v === state.group) return;
    state.group = b.dataset.v; update();
  });
  sortSel.addEventListener('change', () => { state.sort = sortSel.value; state.desc = SORTS[state.sort].desc; update(); });
  dirBtn.addEventListener('click', () => { state.desc = !state.desc; update(); });
  stylesEl.addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    state.style = state.style === b.dataset.v ? '' : b.dataset.v; update();
  });
  rolesEl.addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    state.role = state.role === b.dataset.v ? '' : b.dataset.v; update();
  });
  traitSel.addEventListener('change', () => { state.trait = traitSel.value; update(); });
  let qTimer = 0;
  document.getElementById('q').addEventListener('input', e => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { state.q = e.target.value; update(false); }, 120);
  });

  // ── 詳細シート ───────────────────────────────────
  const sheet = document.getElementById('sheet');
  const sheetBody = document.getElementById('sheetBody');
  let current = null;
  let returnFocus = null;
  function openSheet(id) {
    const f = byId.get(id);
    if (!f) return;
    if (sheet.hidden) returnFocus = document.activeElement;
    current = id;
    sheetBody.innerHTML = sheetHtml(f);
    wireImageFallback(sheetBody);
    sheetBody.scrollTop = 0;
    document.getElementById('sheetNo').textContent = no(f.id);
    const i = flatOrder.indexOf(id);
    document.getElementById('sheetPos').textContent = i >= 0 ? `${i + 1} / ${flatOrder.length}` : '';
    if (sheet.hidden) {
      sheet.hidden = false;
      document.documentElement.style.overflow = 'hidden';
      document.getElementById('close').focus();
    }
  }
  function closeSheet() {
    if (sheet.hidden) return;
    sheet.hidden = true;
    current = null;
    document.documentElement.style.overflow = '';
    if (returnFocus && document.contains(returnFocus)) returnFocus.focus();
  }
  function step(d) {
    if (!flatOrder.length) return;
    const i = flatOrder.indexOf(current);
    const next = flatOrder[((i < 0 ? 0 : i) + d + flatOrder.length) % flatOrder.length];
    openSheet(next);
  }
  document.getElementById('close').addEventListener('click', closeSheet);
  document.getElementById('prev').addEventListener('click', () => step(-1));
  document.getElementById('next').addEventListener('click', () => step(1));
  sheet.addEventListener('click', e => { if (e.target === sheet) closeSheet(); });
  document.addEventListener('keydown', e => {
    if (sheet.hidden) return;
    if (e.key === 'Escape') { e.preventDefault(); closeSheet(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
    else if (e.key === 'Tab') {
      const focusables = [...sheet.querySelectorAll('button, a[href]')].filter(el => !el.hidden && el.offsetParent !== null);
      if (!focusables.length) return;
      const firstEl = focusables[0], lastEl = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === firstEl) { e.preventDefault(); lastEl.focus(); }
      else if (!e.shiftKey && document.activeElement === lastEl) { e.preventDefault(); firstEl.focus(); }
    }
  });

  // ── 見出しの数字・脚注 ─────────────────────────────
  const workCount = new Set(FIGHTERS.flatMap(f => f.works.map(w => w.url))).size;
  document.getElementById('facts').innerHTML = [
    [FIGHTERS.length, '名'],
    [DATA.series.length, 'の作品シリーズから'],
    [workCount, '本の登場作品'],
  ].map(([n, label]) => `<li><b>${n}</b>${esc(label)}</li>`).join('');
  document.getElementById('legend').innerHTML = STATS.map(([k, abbr, ja]) => `<span data-k="${k}"><b>${abbr}</b>${ja}</span>`).join('') + '<span data-k="ovr"><b>OVR</b>総合</span>';
  document.getElementById('sourceNote').textContent = `ふりがな・出身作品・登場作品は作者のキャラクター資料(${DATA.taken}時点)から。登場作品のリンクは pixiv・FANBOX の投稿ページへ移動します。`;

  update(false);
})();
</script>
